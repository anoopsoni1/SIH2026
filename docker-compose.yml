version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: coop_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: coop_marketplace
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: coop_redis
    restart: always
    ports:
      - "6379:6379"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: coop_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/coop_marketplace
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super_secret_jwt_key_coop_2026_prod
      JWT_REFRESH_SECRET: super_secret_refresh_key_coop_2026_prod
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      - mongodb
      - redis

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: coop_ai_service
    restart: always
    ports:
      - "8000:8000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: coop_client
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongodb_data:
